<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>冀C 9月周切换看板</title>

<style>
* { box-sizing: border-box; }
body { font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#F4F6F9; margin:0; color:#1F2937; }
.hd { background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 100%); color:#fff; padding:18px 28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
.hd h1 { margin:0 0 4px; font-size:22px; font-weight:600; }
.hd .sub { font-size:13px; opacity:.85; }

.week-tabs { background:#fff; padding:14px 28px 0; border-bottom:1px solid #E5E7EB; display:flex; gap:8px; flex-wrap:wrap; }
.week-tab { padding:10px 20px; border-radius:8px 8px 0 0; cursor:pointer; font-size:13px; font-weight:500;
            background:#F3F4F6; color:#4B5563; border:1px solid #E5E7EB; border-bottom:none; transition:.2s; user-select:none; }
.week-tab:hover { background:#E5E7EB; }
.week-tab.active { background:#2563EB; color:#fff; border-color:#2563EB; }
.week-tab .meta { display:block; font-size:11px; opacity:.85; font-weight:400; margin-top:2px; }
.week-tab .pct { font-weight:600; margin-left:6px; }

.container { padding:24px 28px; max-width:1480px; margin:0 auto; }

.kpi-row { display:grid; grid-template-columns:repeat(7,1fr); gap:14px; margin-bottom:18px; }
.kpi { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); position:relative; }
.kpi .label { font-size:11px; color:#6B7280; margin-bottom:6px; }
.kpi .val { font-size:22px; font-weight:700; color:#111827; line-height:1.1; }
.kpi .sub { font-size:11px; color:#9CA3AF; margin-top:6px; }
.kpi .badge { position:absolute; top:10px; right:10px; font-size:10px; padding:2px 6px; border-radius:4px;
              font-weight:600; background:#F3F4F6; color:#6B7280; }
.kpi .badge.up { background:#FEE2E2; color:#B91C1C; }
.kpi .badge.down { background:#DCFCE7; color:#166534; }

.chan-row { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:18px; }
.chan-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); border-top:4px solid; position:relative; }
.chan-card .ch-name { font-size:13px; font-weight:600; color:#374151; }
.chan-card .ch-amt { font-size:20px; font-weight:700; color:#111827; margin:6px 0 10px; }
.chan-card .ch-meta { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:11px; color:#6B7280; }
.chan-card .ch-meta b { color:#1F2937; font-weight:600; }
.chan-card .ch-bar { height:6px; background:#F3F4F6; border-radius:3px; margin-top:10px; overflow:hidden; }
.chan-card .ch-bar div { height:100%; border-radius:3px; }
.chan-card .ch-vs { position:absolute; top:10px; right:10px; font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; }

.section { background:#fff; border-radius:12px; padding:20px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
.sec-title { font-size:15px; font-weight:600; color:#111827; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.sec-title::before { content:""; width:4px; height:16px; background:#2563EB; border-radius:2px; }
.chart-row { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; }

.subtabs { display:flex; gap:4px; border-bottom:1px solid #E5E7EB; margin-bottom:14px; flex-wrap:wrap; }
.subtab { padding:6px 14px; font-size:12px; cursor:pointer; color:#6B7280; border-bottom:2px solid transparent; user-select:none; }
.subtab.active { color:#2563EB; border-color:#2563EB; font-weight:600; }

.tbl { width:100%; border-collapse:collapse; font-size:12px; }
.tbl th { background:#F9FAFB; padding:8px 10px; text-align:left; font-weight:600; color:#4B5563; border-bottom:1px solid #E5E7EB; }
.tbl td { padding:8px 10px; border-bottom:1px solid #F3F4F6; }
.tbl tr:hover { background:#F9FAFB; }
.tbl .num { text-align:right; font-variant-numeric:tabular-nums; }
.tbl .amt { font-weight:600; }
.tbl .up { color:#B91C1C; font-weight:600; }
.tbl .down { color:#166534; font-weight:600; }
.tbl .zero { color:#9CA3AF; }
.tbl-wrap { max-height:480px; overflow-y:auto; }
.tbl tfoot td { background:#DDEBF7; font-weight:600; border-top:2px solid #93C5FD; border-bottom:none; }
.tbl td.best { background:#FEF3C7; }
.bar-wrap { background:#E5E7EB; border-radius:6px; height:10px; overflow:hidden; min-width:80px; }
.bar-wrap > div { height:100%; background:linear-gradient(90deg,#10B981,#2563EB); }
.bar-wrap.warn > div { background:linear-gradient(90deg,#F59E0B,#EF4444); }

.insight { padding:12px 16px; border-left:4px solid #2563EB; background:#EFF6FF; border-radius:6px; margin-bottom:10px; font-size:13px; line-height:1.7; }
.insight b { color:#1E40AF; }
.insight.warn { border-color:#DC2626; background:#FEF2F2; }
.insight.warn b { color:#991B1B; }
.insight.good { border-color:#16A34A; background:#F0FDF4; }
.insight.good b { color:#166534; }

.partial-note { background:#FEF3C7; color:#92400E; padding:8px 14px; border-radius:6px; font-size:12px; margin-bottom:14px; display:flex; align-items:center; gap:6px; }

#progress-section .prog-bar { background:#E5E7EB; border-radius:6px; height:14px; overflow:hidden; margin:6px 0; }
#progress-section .prog-bar div { height:100%; background:linear-gradient(90deg,#10B981,#2563EB); }
</style>
</head>

function fmt(n) { return '¥' + Math.round(n).toLocaleString(); }
function pct_(n) { return (n>=0?'+':'') + n.toFixed(1) + '%'; }

function chgBadgeHTML(curr, prev) {
  if (prev === null || prev === undefined || curr === null || curr === undefined)
    return '<span class="badge">首期</span>';
  if (typeof curr !== 'number' || typeof prev !== 'number')
    return '';
  const c = curr - prev;
  const p = prev > 0 ? c / prev * 100 : 0;
  return '<span class="badge ' + (c>=0?'up':'down') + '">' + (c>=0?'+':'') + p.toFixed(1) + '%</span>';
}

function renderTabs() {
  const el = document.getElementById('week-tabs');
  el.innerHTML = DATA.weeks.map((w,i)=>{
    const chg = w.total.chg_total !== undefined ? w.total.chg_total : null;
    let pctTxt = '<span style="color:#9CA3AF;font-weight:400">首期</span>';
    if (chg !== null && chg !== undefined && typeof chg === 'number') {
      pctTxt = '<span class="pct" style="color:' + (chg>=0?'#16A34A':'#DC2626') + '">' + pct_(chg) + '</span>';
    }
    const partial = w.is_partial ? ' ⚠️' : '';
    return '<div class="week-tab ' + (i===curWeek?'active':'') + '" onclick="switchWeek(' + i + ')">'
      + w.label + partial + '<span class="meta">' + w.short + ' · ' + w.actual_days + '天 ' + pctTxt + '</span>'
      + '</div>';
  }).join('');
}

function renderKPI() {
  const w = DATA.weeks[curWeek];
  const t = w.total;
  const prev = curWeek>0 ? DATA.weeks[curWeek-1].total : null;
  const prog = DATA.cum.progress;
  const cumA = DATA.cum.total.a;
  const kpis = [
    {l:'成交额', v:fmt(t.a), sub:'日均 ' + fmt(t.avg_day_amt), prev: prev ? prev.a : null},
    {l:'订单数', v:t.o, sub:'日均 ' + Math.round(t.o/t.days) + '单', prev: prev ? prev.o : null},
    {l:'进店客户', v:t.c, sub:'日均 ' + Math.round(t.c/t.days) + '人', prev: prev ? prev.c : null},
    {l:'综合成交率', v:t.conv+'%', sub:'业内均值25-30%', prev: prev ? prev.conv : null},
    {l:'平均客单价', v:fmt(t.avg), sub:'较上月持平', prev: null},
    {l:'首进/首成', v:t.first_in + '/' + t.first_o, sub:'一次成交率 ' + (t.first_in ? Math.round(t.first_o/t.first_in*100):0) + '%', prev: null},
    {l:'9月累计进度', v:prog+'%', sub:(cumA/10000).toFixed(1)+'万/'+(DATA.cum.target/10000).toFixed(0)+'万', prev: null},
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k =>
    '<div class="kpi">'
    + '<div class="label">' + k.l + '</div>'
    + '<div class="val">' + k.v + '</div>'
    + '<div class="sub">' + k.sub + '</div>'
    + chgBadgeHTML(typeof k.v === 'string' && k.v.includes('%') ? parseFloat(k.v) : null, k.prev)
    + '</div>'
  ).join('');
}

      + '<div class="ch-amt">' + fmt(c.a) + '</div>'
      + '<div class="ch-meta">'
        + '<div>客户<b>' + c.c + '</b></div>'
        + '<div>订单<b>' + c.o + '</b></div>'
        + '<div>转化率<b>' + c.conv + '%</b></div>'
        + '<div>占比<b>' + c.share + '%</b></div>'
      + '</div>'
      + '<div class="ch-bar"><div style="width:' + Math.min(c.share,100) + '%;background:' + color + '"></div></div>'
    + '</div>';
  }).join('');
}

function renderProgress() {
  const cum = DATA.cum;
  document.getElementById('prog-big').textContent = cum.progress + '%';
  document.getElementById('prog-fill').style.width = Math.min(cum.progress,100) + '%';
  const need = cum.need_daily;
  const cur = cum.cur_daily;
  const ratio = cur > 0 ? (need/cur) : 0;
  document.getElementById('prog-detail').innerHTML =
    '<b>累计 ' + fmt(cum.total.a) + '</b> (天 ' + cum.days + ')<br>'
    + '目标 <b>' + fmt(cum.target) + '</b> · 还差 <b>' + fmt(cum.remain_amt) + '</b> · 剩余 <b>' + cum.remain_days + ' 天</b><br>'
    + '需日均 <b style="color:#B91C1C">' + fmt(need) + '</b> · 当前日均 <b>' + fmt(cur) + '</b> · 倍数 <b style="color:' + (ratio>1?'#B91C1C':'#16A34A') + '">' + ratio.toFixed(2) + 'x</b>';
}

function renderCharts() {
  const w = DATA.weeks[curWeek];
  if (chartCmp) chartCmp.destroy();
  if (chartShare) chartShare.destroy();
  const cmpCtx = document.getElementById('chart-cmp').getContext('2d');
  const prev = curWeek>0 ? DATA.weeks[curWeek-1] : null;
  chartCmp = new Chart(cmpCtx, {
    type: 'bar',
    data: {
      labels: DATA.ch_labels,
      datasets: [
        { label: '本周', data: DATA.ch_labels.map(c => w.channels[c].a),
           backgroundColor: DATA.ch_labels.map(c => DATA.ch_colors[c]), borderRadius: 6 },
        { label: '上周', data: DATA.ch_labels.map(c => prev ? prev.channels[c].a : 0),
           backgroundColor: '#E5E7EB', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: {
        label: (ctx) => ctx.dataset.label + ': ' + fmt(ctx.parsed.y)
      } } },
      scales: { y: { ticks: { callback: v => '¥'+(v/10000).toFixed(0)+'万' } } }
    }
  });
  const shCtx = document.getElementById('chart-share').getContext('2d');
  const sh = DATA.ch_labels.map(c => w.channels[c].share);
  const colors = DATA.ch_labels.map(c => DATA.ch_colors[c]);
  chartShare = new Chart(shCtx, {
    type: 'doughnut',
    data: { labels: DATA.ch_labels, datasets: [{ data: sh, backgroundColor: colors, borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'right' }, tooltip: { callbacks: {
        label: (ctx) => ctx.label + ': ' + ctx.parsed.toFixed(1) + '%'
      } } }
    }
  });
}

function renderDaily() {
  const w = DATA.weeks[curWeek];
  if (chartDaily) chartDaily.destroy();
  const labels = w.daily.map(d => d.d);
  const colors = DATA.ch_colors;
  let cfg;
  if (curDaily === 'amt' || curDaily === 'ord') {
    const key = curDaily === 'amt' ? 'ch_a' : 'ch_o';
    cfg = {
      type: 'bar',
      data: {
        labels: labels,
        datasets: DATA.ch_labels.map(c => ({
          label: c,
          data: w.daily.map(d => d[key][c]),
          backgroundColor: colors[c],
          stack: 's'
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top' }, tooltip: { callbacks: {
          label: (ctx) => ctx.dataset.label + ': ' + (curDaily === 'amt' ? fmt(ctx.parsed.y) : ctx.parsed.y + '单')
        } } },
        scales: { x: { stacked: true }, y: { stacked: true,
          ticks: { callback: v => curDaily === 'amt' ? '¥'+(v/10000).toFixed(1)+'万' : v+'单' }
        } }
      }
    };
  } else {
    cfg = {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '日总金额',
          data: w.daily.map(d => d.a),
          borderColor: '#2563EB', backgroundColor: 'rgba(37,99,235,0.1)',
          fill: true, tension: 0.3, pointRadius: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { callback: v => '¥'+(v/10000).toFixed(1)+'万' } } }
      }
    };
  }
  chartDaily = new Chart(document.getElementById('chart-daily').getContext('2d'), cfg);
}

let curChanTab = 0;
function renderStoreTabs() {
  document.getElementById('store-tabs').innerHTML = DATA.ch_labels.map((ch,i) =>
    '<div class="subtab ' + (i===curChanTab?'active':'') + '" onclick="switchChan(' + i + ')">' + ch + '</div>'
  ).join('');
}

function renderStores() {
  const w = DATA.weeks[curWeek];
  const ch = DATA.ch_labels[curChanTab];
  const prev = curWeek>0 ? DATA.weeks[curWeek-1] : null;

  // 关键改动：按渠道过滤门店并排序
  // 每个门店在 ch 渠道下的金额 / 订单 / 客户数
  const prevStores = prev ? prev.stores : null;
  // 构建 prev 门店金额映射
  const prevMap = new Map();
  if (prevStores) {
    prevStores.forEach(s => {
      prevMap.set(s.name, (s.ch && s.ch[ch]) ? s.ch[ch].a : 0);
    });
  }

  // 当前周门店列表 + 渠道金额
  const items = w.stores.map(s => {
    const chd = (s.ch && s.ch[ch]) || {c:0, o:0, a:0};
    return {
      name: s.name,
      c: chd.c,
      o: chd.o,
      a: chd.a,
      conv: chd.c ? Math.round(chd.o / chd.c * 1000) / 10 : 0,
      avg: chd.o ? chd.a / chd.o : 0,
      prevA: prevMap.get(s.name) || null,
    };
  });
  // 按渠道金额降序
  items.sort((a, b) => b.a - a.a);
  // 总金额汇总
  const sumC = items.reduce((p, x) => p + x.c, 0);
  const sumO = items.reduce((p, x) => p + x.o, 0);
  const sumA = items.reduce((p, x) => p + x.a, 0);
  // 摘要
  document.getElementById('store-summary').innerHTML =
    '<b>' + ch + '</b> 渠道 共 <b>' + items.length + '</b> 家门店有数据'
    + ' · 客户 <b>' + sumC + '</b> · 订单 <b>' + sumO + '</b>'
    + ' · 金额 <b style="color:#2563EB">' + fmt(sumA) + '</b>'
    + (sumO>0 ? ' · 转化率 <b>' + Math.round(sumO/sumC*1000)/10 + '%</b>' : '')
    + (prev === null ? ' <span style="background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:8px">📌 首周数据，暂无上周对比</span>' : '');

  document.getElementById('store-tbody').innerHTML = items.map(s => {
    const diff = (s.prevA !== null && s.prevA !== undefined) ? (s.a - s.prevA) : null;
    const diffTxt = diff === null ? '<span class="zero">—</span>'
      : '<span class="' + (diff>=0?'up':'down') + '">' + (diff>=0?'+':'') + fmt(diff) + '</span>';
    const prevTxt = (s.prevA === null || s.prevA === undefined) ? '<span class="zero">—</span>' : fmt(s.prevA);
    return '<tr>'
      + '<td>' + s.name + '</td>'
      + '<td class="num">' + s.c + '</td>'
      + '<td class="num">' + s.o + '</td>'
      + '<td class="num amt">' + fmt(s.a) + '</td>'
      + '<td class="num">' + s.conv + '%</td>'
      + '<td class="num">' + fmt(s.avg) + '</td>'
      + '<td class="num">' + prevTxt + '</td>'
      + '<td class="num">' + diffTxt + '</td>'
      + '</tr>';
  }).join('');

  // 合计行
  const totC = items.reduce((p, x) => p + x.c, 0);
  const totO = items.reduce((p, x) => p + x.o, 0);
  const totA = items.reduce((p, x) => p + x.a, 0);
  const totPrev = items.reduce((p, x) => p + (x.prevA || 0), 0);
  const hasPrev = items.some(x => x.prevA !== null && x.prevA !== undefined);
  const totDiff = totA - totPrev;
  document.getElementById('store-tfoot').innerHTML = '<tr>'
    + '<td>合计</td>'
    + '<td class="num">' + totC + '</td>'
    + '<td class="num">' + totO + '</td>'
    + '<td class="num amt">' + fmt(totA) + '</td>'
    + '<td class="num">' + (totC ? Math.round(totO / totC * 1000) / 10 : 0) + '%</td>'
    + '<td class="num">' + (totO ? fmt(totA / totO) : '—') + '</td>'
    + '<td class="num">' + (hasPrev ? fmt(totPrev) : '—') + '</td>'
    + '<td class="num">' + (hasPrev ? '<span class="' + (totDiff >= 0 ? 'up' : 'down') + '">' + (totDiff >= 0 ? '+' : '') + fmt(totDiff) + '</span>' : '—') + '</td>'
    + '</tr>';
}

/* ===== 各门店 × 各渠道 汇总合计 ===== */
function renderStoreChMatrix() {
  const w = DATA.weeks[curWeek];
  const rows = w.stores.slice().sort((a, b) => b.a - a.a);   // 按全渠道合计降序
  const grand = rows.reduce((p, s) => p + s.a, 0);
  const chTotals = DATA.ch_labels.map(k => rows.reduce((p, s) => p + ((s.ch && s.ch[k]) ? s.ch[k].a : 0), 0));

  document.getElementById('store-ch-thead').innerHTML =
    '<tr><th>门店</th>'
    + DATA.ch_labels.map(k => '<th class="num">' + k + '</th>').join('')
    + '<th class="num">合计</th><th class="num">占区域</th><th class="num">最强渠道</th></tr>';

  document.getElementById('store-ch-tbody').innerHTML = rows.map(s => {
    let bestIdx = -1, bestV = -1;
    DATA.ch_labels.forEach((k, i) => {
      const v = (s.ch && s.ch[k]) ? s.ch[k].a : 0;
      if (v > bestV) { bestV = v; bestIdx = i; }
    });
    const cells = DATA.ch_labels.map((k, i) => {
      const v = (s.ch && s.ch[k]) ? s.ch[k].a : 0;
      return '<td class="num' + (i === bestIdx && bestV > 0 ? ' best' : '') + '">' + fmt(v) + '</td>';
    }).join('');
    const p = grand ? (s.a / grand * 100) : 0;
    return '<tr><td>' + s.name + '</td>' + cells
      + '<td class="num amt"><b>' + fmt(s.a) + '</b></td>'
      + '<td class="num">' + p.toFixed(1) + '%</td>'
      + '<td class="num">' + (bestV > 0 ? DATA.ch_labels[bestIdx] : '—') + '</td></tr>';
  }).join('');

  document.getElementById('store-ch-tfoot').innerHTML =
    '<tr><td>区域合计</td>'
    + chTotals.map(v => '<td class="num">' + fmt(v) + '</td>').join('')
    + '<td class="num amt">' + fmt(grand) + '</td><td class="num">100%</td><td class="num">—</td></tr>';

  const top = rows[0];
  document.getElementById('store-ch-summary').innerHTML =
    '<b>' + w.label + '</b>（' + w.short + '，实报' + w.actual_days + '天）· ' + rows.length + ' 家门店'
    + ' · 全渠道合计 <b style="color:#2563EB">' + fmt(grand) + '</b>'
    + (top ? ' · 第一：<b>' + top.name.replace(/\(.*\)$/, '') + '</b> ' + fmt(top.a)
        + '（占 ' + (grand ? (top.a / grand * 100).toFixed(1) : 0) + '%）' : '')
    + ' · 黄色底纹 = 该门店最强渠道';
}

/* ===== 邀约放量行动 ===== */
function renderInvite() {
  const iv = DATA.invite;
  if (!iv || !iv.rows || !iv.rows.length) return;
  const money = n => '¥' + Math.round(n).toLocaleString();
  document.getElementById('inv-bench').innerHTML =
    '统计口径：9.1-' + iv.days + '日累计 · 标杆城市 <b style="color:#2563EB">' + iv.bench + '</b>'
    + '（邀约 ' + money(iv.bench_a_psd) + '/店/天 · ' + iv.bench_c_psd + ' 客户/店/天 · 转化 '
    + iv.bench_conv + '% · 客单价 ' + money(iv.bench_kdj) + '）'
    + ' · 剩 <b>' + iv.remain + '</b> 天';

  document.getElementById('inv-thead').innerHTML =
    '<tr><th>城市</th><th class="num">门店</th><th class="num">邀约金额</th><th class="num">转化率</th>'
    + '<th class="num">客单价</th><th class="num">强度(元/店/天)</th><th class="num">对标标杆</th>'
    + '<th class="num">每日需补客户</th><th class="num">保守可追(剩' + iv.remain + '天)</th>'
    + '<th class="num">激进可追</th></tr>';

  const top = iv.rows[0].a_psd || 1;
  document.getElementById('inv-tbody').innerHTML = iv.rows.map(r => {
    const pctv = Math.round(r.a_psd / top * 100);
    const bar = '<div class="bar-wrap' + (pctv < 50 ? ' warn' : '') + '"><div style="width:' + pctv + '%"></div></div>';
    return '<tr><td><b>' + r.city + '</b>' + (r.city === iv.bench ? ' <span style="color:#2563EB;font-size:11px">标杆</span>' : '') + '</td>'
      + '<td class="num">' + r.n + '</td>'
      + '<td class="num amt">' + money(r.a) + '</td>'
      + '<td class="num">' + r.conv + '%</td>'
      + '<td class="num">' + money(r.kdj) + '</td>'
      + '<td class="num">' + money(r.a_psd) + '</td>'
      + '<td style="min-width:110px">' + bar + '<div style="font-size:11px;color:#6B7280;margin-top:2px">' + pctv + '%</div></td>'
      + '<td class="num">' + (r.gap_c_day > 0 ? '+' + r.gap_c_day + ' 人' : '—') + '</td>'
      + '<td class="num">' + (r.cons_remain > 0 ? money(r.cons_remain) : '—') + '</td>'
      + '<td class="num">' + (r.aggr_remain > 0 ? money(r.aggr_remain) : '—') + '</td></tr>';
  }).join('');

  document.getElementById('inv-tfoot').innerHTML = '<tr><td>合计</td>'
    + '<td class="num">' + iv.rows.reduce((p, r) => p + r.n, 0) + '</td>'
    + '<td class="num amt">' + money(iv.rows.reduce((p, r) => p + r.a, 0)) + '</td>'
    + '<td class="num">' + Math.round(iv.rows.reduce((p, r) => p + r.o, 0) / iv.rows.reduce((p, r) => p + r.c, 0) * 1000) / 10 + '%</td>'
    + '<td class="num">' + money(iv.rows.reduce((p, r) => p + r.a, 0) / iv.rows.reduce((p, r) => p + r.o, 0)) + '</td>'
    + '<td class="num">' + money(iv.rows.reduce((p, r) => p + r.a_psd * r.n, 0) / iv.rows.reduce((p, r) => p + r.n, 0)) + '</td>'
    + '<td class="num">—</td>'
    + '<td class="num">+' + Math.round(iv.rows.reduce((p, r) => p + r.gap_c_day, 0) * 10) / 10 + ' 人</td>'
    + '<td class="num amt">' + money(iv.cons_total) + '</td>'
    + '<td class="num amt">' + money(iv.aggr_total) + '</td></tr>';

  const cov1 = iv.gap_target ? (iv.cons_total / iv.gap_target * 100) : 0;
  const cov2 = iv.gap_target ? (iv.aggr_total / iv.gap_target * 100) : 0;
  document.getElementById('inv-gap').innerHTML =
    '<div style="font-size:12px;color:#6B7280;margin-bottom:4px">邀约放量对目标缺口的覆盖度'
    + '（缺口 <b>' + money(iv.gap_target) + '</b>，剩 ' + iv.remain + ' 天需日均 <b>' + money(iv.need_daily) + '</b>）</div>'
    + '<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px">'
    + '<span style="width:96px">保守（只补量）</span>'
    + '<div class="bar-wrap warn" style="flex:1"><div style="width:' + cov1.toFixed(1) + '%"></div></div>'
    + '<b>' + money(iv.cons_total) + ' · ' + cov1.toFixed(1) + '%</b></div>'
    + '<div style="display:flex;align-items:center;gap:8px;font-size:12px">'
    + '<span style="width:96px">激进（量+效率）</span>'
    + '<div class="bar-wrap" style="flex:1"><div style="width:' + cov2.toFixed(1) + '%"></div></div>'
    + '<b>' + money(iv.aggr_total) + ' · ' + cov2.toFixed(1) + '%</b></div>';

  document.getElementById('inv-zero').innerHTML = iv.zero && iv.zero.length
    ? '⚠️ 邀约 0 产出门店（' + iv.zero.length + ' 家，需立即破零）：' + iv.zero.join('、')
    : '';
}

function renderInsights() {
  const w = DATA.weeks[curWeek];
  const cum = DATA.cum;
  const remain = cum.target - cum.total.a;
  const need = cum.need_daily;
  const cur = cum.cur_daily;
  const gap = cur > 0 ? (need/cur).toFixed(2) : '—';
  const html = ''
    + '<div class="insight"><b>📊 整体盘面：</b>本周 ' + w.total.c + ' 位客户进店，成交 ' + w.total.o + ' 单，金额 ' + fmt(w.total.a)
    + '；综合成交率 <b>' + w.total.conv + '%</b>，客单价 <b>' + fmt(w.total.avg) + '</b>。</div>'
    + '<div class="insight"><b>🔍 渠道结构：</b>本周 <b>邀约到店' + w.channels['邀约到店'].share + '%</b>，自然进店 <b>' + w.channels['自然进店'].share + '%</b>；'
    + '邀约转化率 ' + w.channels['邀约到店'].conv + '% vs 自然 ' + w.channels['自然进店'].conv + '%。</div>'
    + '<div class="insight warn"><b>⚠️ 9月进度：</b>累计 ' + fmt(cum.total.a) + ' / ' + fmt(cum.target)
    + ' = <b>' + cum.progress + '%</b>（已 ' + cum.days + ' 天 / 剩余 ' + cum.remain_days + ' 天）<br>'
    + '需日均 <b>' + fmt(need) + '</b>，当前 <b>' + fmt(cur) + '</b>，倍数 <b>' + gap + 'x</b>。<br>'
    + '按当前节奏月底预计 ' + fmt(cur * 30) + '，缺口 ' + fmt(Math.max(0, cum.target - cur*30)) + '。</div>';
  document.getElementById('insights').innerHTML = html;
}

function switchWeek(i) { curWeek = i; renderAll(); }
function switchChan(i) { curChanTab = i; renderStoreTabs(); renderStores(); }
function switchDaily(d) { curDaily = d; renderDaily(); }

function bindSubtabs(selector, handler) {
  document.querySelectorAll(selector).forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll(selector).forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      handler(el);
    });
  });
}
bindSubtabs('#daily-tabs .subtab', el => switchDaily(el.dataset.d));

function renderAll() {
  renderTabs();
  renderKPI();
  renderChans();
  renderProgress();
  renderCharts();
  renderDaily();
  renderStoreTabs();
  renderStores();
  renderStoreChMatrix();
  renderInvite();
  renderInsights();
  const w = DATA.weeks[curWeek];
  document.querySelectorAll('.partial-note').forEach(e => e.remove());
  if (w.is_partial) {
    const note = document.createElement('div');
    note.className = 'partial-note';
    note.innerHTML = '⚠️ 本周数据截至 ' + w.actual_last + '（仅 ' + w.actual_days + ' 天），环比数字仅供参考。';
    document.querySelector('.container').insertBefore(note, document.querySelector('.kpi-row'));
  }
}

renderAll();
</script>
</body>
</html>
